name: Update Sci-Hub domains

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/update-scihub-domains.py --file scihub-domains.json
      - name: Commit changes
        run: |
          if git diff --quiet -- scihub-domains.json; then
            echo "No Sci-Hub domain changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scihub-domains.json
          git commit -m "Update Sci-Hub domain order"
          git push
